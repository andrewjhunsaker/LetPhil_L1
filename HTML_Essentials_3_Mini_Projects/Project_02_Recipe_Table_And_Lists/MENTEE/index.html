<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="table lists and what not">
    <meta name="keywords" content="tables, lists">
    <meta name="author" content="Andrew Hunsaker">

  </head>
  <body>
    <div class="table">
      <h1>Tables</h1>
      <table>
        <thead>
          <th>Header 1</th>
          <th>Header 2</th>
          <th>Header 3</th>
        </thead>
        <tr>
          <td>Item 1</td>
          <td>Item 2</td>
          <td>Item 3</td>
        </tr>
      </table>
    </div>

    <div class="unordered-list">
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
      </ul>
    </div>
    <div class="ordered-list">
      <ol>
        <li>first</li>
        <li>second</li>
        <li>third</li>
      </ol>
    </div>
  
    <div class="reset-form">
      <form>
        <label for="default-name">Default Name</label>
        <input id="default-name" name="defaultName" type="text" value="Default User">

        <label>
          <input name="radio" type="radio" value="light" checked>
          Light
        </label>
        <label>
          <input name="radio" type="radio" value="dark">
          Dark
        </label>

        <label for="languages">Languages</label>
        <select id="languages" name="languages">
          <option value="english" selected>English</option>
          <option value="spanish">Spanish</option>
          <option value="french">French</option>
        </select>
        <label for="textarea">Suggestions</label>
        <textarea name="textarea" id="textarea">This is the default textarea text.</textarea>  
        
        <button type="reset">Reset</button>
      </form>
    </div>
  </body>
</html>
